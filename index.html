<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub | Web Games Collection</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #0a0a0f;
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Animated Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            background: var(--primary);
            width: 400px;
            height: 400px;
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb-2 {
            background: var(--accent);
            width: 300px;
            height: 300px;
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        .orb-3 {
            background: var(--secondary);
            width: 350px;
            height: 350px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: -10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* Layout & Header */
        header {
            text-align: center;
            padding: 80px 20px 40px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #a855f7, #ec4899, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px;
            position: relative;
            z-index: 10;
        }

        /* Config Notice */
        .dev-notice {
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
            display: none;
            /* Hidden unless API is unreachable */
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease-out;
        }

        /* Grid System */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Game Cards - Glassmorphism */
        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 0.6s ease-out forwards;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(99, 102, 241, 0.2);
        }

        .game-card:hover::before {
            opacity: 1;
        }

        /* Icon Placeholder */
        .game-icon {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 24px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-icon {
            transform: scale(1.1) rotate(5deg);
        }

        /* Text Elements */
        .game-card h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .game-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .play-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .game-card:hover .play-btn {
            background: var(--text-main);
            color: var(--bg-base);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Animations */
        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Loader */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px dashed var(--card-border);
        }
    </style>
</head>

<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <header>
        <h1>ARCADE <span>HUB</span></h1>
        <p class="subtitle">Select a game below to start playing</p>
    </header>

    <main>
        <div id="dev-notice" class="dev-notice" style="display: none;">
            <strong>No Games Found:</strong> Could not load games.json. Did you forget to run `python
            generate_games.py`? Or you might need to view this through a simple web server rather than double clicking
            the file depending on browser settings.
        </div>

        <div id="loading" class="loader">
            <div class="spinner"></div>
        </div>

        <section class="game-grid" id="game-grid" style="display: none;">
            <!-- Games will be injected here dynamically -->
        </section>
    </main>

    <script>
        // Function to create a visually distinct color/gradient for icons based on game ID
        function getGradientColors(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const h = hash % 360;
            return `linear-gradient(135deg, hsl(${h}, 80%, 60%), hsl(${(h + 40) % 360}, 80%, 50%))`;
        }

        function formatName(id) {
            return id.replace(/[_\-]/g, ' ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        async function loadGames() {
            const grid = document.getElementById('game-grid');
            const loading = document.getElementById('loading');
            const notice = document.getElementById('dev-notice');

            let gamesToRender = [];

            try {
                // Fetch the static JSON file
                // Note: If running locally via double-click (file://), some strict browsers
                // will block fetch due to CORS policies. Running a small local server solves this. 
                const response = await fetch('games.json', { cache: 'no-store' });

                if (response.ok) {
                    gamesToRender = await response.json();
                } else {
                    console.error("Failed to load games.json", response.statusText);
                    notice.style.display = 'block';
                }
            } catch (e) {
                console.error("Error fetching games.json (Possible CORS issue on local file://)", e);
                notice.style.display = 'block';
            }

            // Hide loader
            loading.style.display = 'none';

            // Render
            grid.style.display = 'grid';
            grid.innerHTML = '';

            if (gamesToRender.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h2>No games found</h2>
                        <p style="color: var(--text-muted); margin-top: 10px;">Make sure you generated games.json using the python tool.</p>
                    </div>
                `;
                return;
            }

            gamesToRender.forEach((game, index) => {
                const gameName = game.name || formatName(game.id);
                const firstLetter = gameName.charAt(0).toUpperCase();
                const path = game.path || `./${game.id}/${game.id}.html`;
                const desc = game.desc || 'Explore this game.';

                const card = document.createElement('a');
                card.href = path;
                card.className = 'game-card';
                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <div class="game-icon" style="background: ${getGradientColors(game.id)}">${firstLetter}</div>
                    <h2>${gameName}</h2>
                    <p>${desc}</p>
                    <span class="play-btn">Play Now</span>
                `;
                grid.appendChild(card);
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadGames);
    </script>
</body>

</html>
